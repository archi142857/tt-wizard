# 출시용 안드로이드 AAB(업로드 키로 서명) — 백엔드 update86(11/3). 쓰는 법은 docs/app.md '출시 빌드 (서명한 AAB)'.
# Actions 화면에서 손으로만 돌린다(Run workflow). 만든 AAB 를 Play Console 의 비공개 테스트 트랙에 올린다.
# 업로드 키는 저장소 비밀값(Settings > Secrets and variables > Actions) 넷으로만 받는다. 키 파일·비밀번호는 git 에 없고, 로그에 찍지 않는다:
#   TTW_KEYSTORE_BASE64    업로드 키 파일(.jks)을 base64 글로 바꾼 것
#   TTW_KEYSTORE_PASSWORD  키 파일 비밀번호
#   TTW_KEY_ALIAS          키 이름(keytool 의 -alias)
#   TTW_KEY_PASSWORD       키 비밀번호(PKCS12 키 파일이면 키 파일 비밀번호와 같다)
# versionCode 는 이 워크플로의 실행 번호 + 100 이다(Play 는 올릴 때마다 커져야 한다. 올리지 않은 실행이 번호를 건너뛰어도 된다).
# versionName 은 build.gradle 그대로(웹 APP_VERSION 과 같다).

name: release

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Signing secrets
        env:
          KEYSTORE: ${{ secrets.TTW_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TTW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TTW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TTW_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing TTW_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing TTW_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing TTW_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing TTW_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::저장소 비밀값이 없다:$missing (docs/app.md '출시 빌드 (서명한 AAB)')"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Web data
        run: python scripts/export_web.py
        env:
          FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}  # 로그인(update110)
      - name: Install Capacitor
        working-directory: app
        run: npm ci
      - name: Bundle web screens into the app
        run: python scripts/build_app.py
      - name: Sync Android project
        working-directory: app
        run: npx cap sync android
      - name: Upload key file
        # 비밀값의 base64 글을 실행기 임시 폴더의 파일로(저장소 폴더 밖). 마지막 단계가 지운다
        env:
          KEYSTORE: ${{ secrets.TTW_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
          echo "TTW_KEYSTORE_FILE=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
      - name: Build release AAB
        working-directory: app/android
        env:
          TTW_KEYSTORE_PASSWORD: ${{ secrets.TTW_KEYSTORE_PASSWORD }}
          TTW_KEY_ALIAS: ${{ secrets.TTW_KEY_ALIAS }}
          TTW_KEY_PASSWORD: ${{ secrets.TTW_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          export TTW_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          echo "TTW_VERSION_CODE=$TTW_VERSION_CODE" >> "$GITHUB_ENV"
          ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Signature and version
        # 실행 화면의 요약(Summary)에: versionCode·versionName, 서명 확인, 업로드 인증서 지문(SHA-256. 공개해도 되는 값,
        # Play Console 의 업로드 키 인증서와 같아야 하고, 직접 깐 출시 빌드로 링크를 열 때 assetlinks.json 에 넣는다)
        run: |
          aab=app/android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" | grep -q "jar verified."
          name=$(grep -oE 'versionName "[^"]+"' app/android/app/build.gradle | cut -d'"' -f2)
          {
            echo "### 출시 AAB"
            echo "- versionCode $TTW_VERSION_CODE · versionName $name · $(du -h "$aab" | cut -f1)"
            echo "- 서명 확인(jarsigner -verify) 통과"
            echo "### 업로드 인증서"
            echo '```'
            keytool -printcert -jarfile "$aab" | grep -E 'Owner|SHA256|Valid'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: tt-wizard-android-release
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error
      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks"
