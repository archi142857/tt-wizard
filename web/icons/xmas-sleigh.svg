<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 286 92" width="286" height="92" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- TT Wizard 크리스마스 테마 그림(디자인 87판, 10월 30일): 순록이 산타 썰매를 끄는 옆모습. 왼쪽(순록 쪽)을 향한다. 디자인 세션이 직접 그렸다.
       순록 코는 짙은 갈색이고 이름이 없다. 색은 크리스마스 토큰을 따른다(인라인으로 넣으면 var() 값, 그림 파일로 쓰면 뒤의 값).
       자리마다 가운데를 기준으로 시계 방향으로 기울여(앞이 들린다) 놓는다: 디자인 규칙 "이벤트 테마"의 "썰매 그림" -->
  <style>
    .xs-red{fill:var(--cta,#DF2932)}.xs-redS{stroke:var(--cta,#DF2932)}.xs-dark{fill:#B71E2A}.xs-darkS{stroke:#B71E2A}
    .xs-gold{fill:var(--on-bg-link,#F8D788)}.xs-goldS{stroke:var(--on-bg-link,#F8D788)}.xs-horn{stroke:#E9C46A}
    .xs-white{fill:#FFFFFF}.xs-whiteS{stroke:#FFFFFF}.xs-skin{fill:#F4CDAE}.xs-cheek{fill:#E9A88A}.xs-ink{fill:#241A15}
    .xs-deer{fill:#B5814F}.xs-deerS{stroke:#B5814F}.xs-deer2S{stroke:#8C5E3C}.xs-deer2{fill:#8C5E3C}.xs-cream{fill:#F2DEC3}.xs-creamS{stroke:#F2DEC3}
    .xs-giftA{fill:var(--item-2,#F7CD6C)}.xs-giftB{fill:var(--item-5,#FBEDD1)}.xs-ribA{stroke:var(--cta,#DF2932)}.xs-ribB{stroke:var(--item-0,#1C6E47)}.xs-mitt{fill:var(--item-0,#1C6E47)}
  </style>
  <g transform="matrix(-1 0 0 1 286 0)">
    <!-- 고삐 -->
    <path class="xs-horn" d="M118 41 C146 34 186 34 232 44" fill="none" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 썰매 날 -->
    <path class="xs-goldS" d="M14 78 H126 C138 78 144 70 141 62" fill="none" stroke-width="4" stroke-linecap="round"/>
    <path class="xs-goldS" d="M40 67 V78 M104 67 V78" stroke-width="4" stroke-linecap="round"/>
    <!-- 선물 -->
    <rect class="xs-giftA" x="34" y="24" width="22" height="22" rx="3"/><path class="xs-ribA" d="M45 24 V46 M34 33 H56" stroke-width="3"/>
    <rect class="xs-giftB" x="52" y="30" width="18" height="16" rx="3"/><path class="xs-ribB" d="M61 30 V46" stroke-width="3"/>
    <!-- 산타 -->
    <path class="xs-red" d="M76 48 C74 34 80 24 92 24 C104 24 110 34 108 48 Z"/>
    <path class="xs-redS" d="M100 32 C108 34 114 38 118 40" fill="none" stroke-width="7" stroke-linecap="round"/>
    <circle class="xs-mitt" cx="119" cy="40.5" r="4.2"/>
    <circle class="xs-skin" cx="94" cy="16" r="8"/>
    <path class="xs-white" d="M90 17 C88 26 94 32 102 31 C106 27 104 20 100 18 Z"/>
    <circle class="xs-cheek" cx="99.5" cy="17.5" r="2"/>
    <circle class="xs-ink" cx="96" cy="14" r="1.2"/>
    <path class="xs-red" d="M86 10 C86 4 92 2 98 4 C101 5 102 8 102 10 Z"/>
    <path class="xs-redS" d="M88 6 C82 4 78 6 76 11" fill="none" stroke-width="5" stroke-linecap="round"/>
    <circle class="xs-white" cx="75" cy="12" r="3.2"/>
    <rect class="xs-white" x="85" y="9" width="18" height="4" rx="2"/>
    <!-- 썰매 몸통: 높은 등받이, 앞이 말려 올라간다 -->
    <path class="xs-red" d="M20 34 C12 36 12 46 20 49 C24 52 26 58 28 62 C30 67 34 68 40 68 H112 C124 68 131 61 133 51 C134 45 137 40 141 38 C145 36 147 40 144 43 C140 46 136 46 132 46 H30 C26 46 24 42 24 38 C24 36 22 34 20 34 Z"/>
    <path class="xs-goldS" d="M20 34 C22 34 24 36 24 38 C24 42 26 46 30 46 H128" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="xs-goldS" d="M133 51 C134 45 137 40 141 38 C145 36 147 40 144 43" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="xs-darkS" d="M40 68 H112 C120 68 126 64 130 58" fill="none" stroke-width="5" stroke-linecap="round"/>
    <!-- 순록: 뒷다리, 몸, 앞다리 -->
    <g transform="translate(-14 0)">
      <path class="xs-deerS" d="M206 54 L190 64 L176 66" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="xs-deer2S" d="M212 56 L198 70 L186 74" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="xs-deer" d="M200 44 C204 34 226 32 244 36 C256 39 262 46 258 54 C254 62 230 64 214 60 C202 57 197 51 200 44 Z"/>
      <path class="xs-creamS" d="M210 58 C222 62 240 62 252 56" fill="none" stroke-width="5" stroke-linecap="round" opacity=".9"/>
      <path class="xs-deer2S" d="M244 56 L256 66 L268 62" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="xs-deerS" d="M250 54 L264 60 L274 54" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="xs-whiteS" d="M198 42 C192 38 190 34 194 31" fill="none" stroke-width="5" stroke-linecap="round"/>
      <path class="xs-deer" d="M244 40 C246 30 254 22 262 18 L270 28 C264 32 258 40 256 48 Z"/>
      <path class="xs-redS" d="M244 40 C248 44 252 48 256 50" fill="none" stroke-width="6" stroke-linecap="round"/>
      <circle class="xs-gold" cx="252" cy="50" r="3.4"/>
      <path class="xs-deer" d="M258 22 C260 14 268 10 276 12 C284 14 290 20 290 25 C290 29 286 31 280 30 C272 30 264 30 260 28 Z"/>
      <path class="xs-cream" d="M278 18 C284 18 290 21 290 25 C290 29 285 31 279 30 Z"/>
      <ellipse class="xs-ink" cx="289" cy="24" rx="3.6" ry="3"/>
      <circle class="xs-ink" cx="274" cy="18" r="1.8"/>
      <path class="xs-deer2" d="M264 14 C258 10 254 10 250 12 C254 16 258 18 263 18 Z"/>
      <g class="xs-horn" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M268 12 C266 6 262 3 256 2"/><path d="M265 7 C266 3 268 1 271 0.5"/><path d="M261 4 C259 2 256 2 253 4"/>
        <path d="M273 11 C274 6 278 3 283 3"/><path d="M276 6 C276 3 277 1.5 279 1"/>
      </g>
    </g>
  </g>
</svg>
